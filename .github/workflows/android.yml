name: Android-Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: "Als Release veröffentlichen, z. B. v1.0.0 (leer lassen = nur bauen)"
        required: false
        default: ""

# Ein auf GitHub angelegtes Release löst „release“ und „push“ (Tag) aus; über die Gruppe läuft nur einer davon zu Ende.
# Ein Push auf den Standard-Branch mit neuer versionName (noch ohne Tag v<versionName>) veröffentlicht das Release automatisch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testen & APK bauen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit-Tests, Lint und APK
        env:
          FITPLAN_KEYSTORE_PASSWORD: ${{ secrets.FITPLAN_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --continue testDebugUnitTest lintDebug assembleRelease 2>&1 | tee build.log

      - name: Fehlerübersicht
        if: failure()
        run: |
          grep -E "^e: |: Error: |FAILED|What went wrong|^> " build.log | head -150 || true

      - name: APK umbenennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/FitPlan.apk
          ls -la dist/

      - name: APK hochladen
        uses: actions/upload-artifact@v5
        with:
          name: FitPlan-apk
          path: dist/FitPlan.apk

      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: berichte
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  ui-test:
    name: UI-Test im Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test-APKs bauen
        timeout-minutes: 25
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest 2>&1 | tee ui-build.log

      - name: Fehlerübersicht Build
        if: failure()
        run: |
          grep -E "^e: |FAILED|What went wrong|^> " ui-build.log | head -100 || true

      - name: UI-Test ausführen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          cores: 4
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest || touch ui-test-failed
            mkdir -p device-screenshots
            adb shell ls -R /sdcard/Android/media/de.fitplan.app.debug /sdcard/Android/data/de.fitplan.app.debug/files || true
            adb pull /sdcard/Android/media/de.fitplan.app.debug device-screenshots/media || true
            adb pull /sdcard/Android/data/de.fitplan.app.debug/files/screenshots device-screenshots/files || true
            test ! -f ui-test-failed

      - name: Screenshots ins Log schreiben
        if: always()
        run: |
          # Verkleinerte Screenshots als Base64 ins Log, damit sie auch ohne Artefakt-Download prüfbar sind.
          find device-screenshots -name '*.jpg' 2>/dev/null | sort | while read -r f; do
            name=$(basename "$f" .jpg)
            echo "SHOT-BEGIN $name"
            base64 -w 4000 "$f" | sed 's/^/SHOT /'
            echo "SHOT-END $name"
          done

      - name: Screenshots und Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test
          path: |
            app/build/outputs/connected_android_test_additional_output/
            device-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  stress-test:
    name: Stresstest Android ${{ matrix.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            android: "10"
          - api-level: 36
            android: "16"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug

      # Tausende zufällige Eingaben (Tippen, Wischen, Zurück); Abstürze und ANRs landen im Log.
      # Der Monkey ist auf 15 Minuten begrenzt, damit die Auswertung auch bei einem hängenden Emulator läuft.
      - name: Zufällige Bedienung (Monkey)
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_7
          cores: 4
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            timeout 900 adb shell monkey -p de.fitplan.app.debug -s 4711 --throttle 60 --pct-syskeys 3 --pct-appswitch 3 --ignore-crashes --ignore-timeouts --ignore-security-exceptions -v 6000 > monkey.log 2>&1 || true
            adb logcat -d -b crash > crash.log 2>&1 || true
            adb logcat -d -v time > logcat.log 2>&1 || true
            adb shell dumpsys dropbox --print data_app_anr > anr.log 2>&1 || true

      - name: Abstürze auswerten
        if: always()
        run: |
          grep -E "Events injected|Monkey finished|CRASH|NOT RESPONDING" monkey.log || tail -n 20 monkey.log || true
          # Abgefangene Fehler aus Hintergrundaufgaben brechen den Test nicht ab, sollen aber sichtbar sein.
          grep -A 12 "E/FitPlan" logcat.log || true
          if grep -q "de.fitplan.app" crash.log; then
            echo "::error::FitPlan ist während des Stresstests abgestürzt"
            cat crash.log
            exit 1
          fi
          if grep -q "ANR in de.fitplan.app" logcat.log && grep -qE "NOT RESPONDING: (com.android.systemui|com.android.phone|com.google.android.apps.nexuslauncher) " monkey.log; then
            # Hängen gleichzeitig Systemoberfläche, Telefon-Dienst oder Startbildschirm, ist der Emulator überlastet – kein Fehler der App.
            echo "::warning::FitPlan reagierte zeitweise nicht, gleichzeitig hingen aber auch Systemprozesse – Emulator überlastet"
            grep "NOT RESPONDING" monkey.log
            grep -m 1 -A 3 "ANR in de.fitplan.app" logcat.log
            echo "Keine Abstürze."
            exit 0
          elif grep -q "ANR in de.fitplan.app" logcat.log; then
            echo "::error::FitPlan reagierte nicht (ANR)"
            grep -A 8 "ANR in de.fitplan.app" logcat.log
            # Woran der Hauptthread hing, steht in den ANR-Traces der Dropbox.
            python3 - <<'PY'
          text = open("anr.log", errors="replace").read()
          for entry in text.split("========================================"):
              if "Process: de.fitplan.app" not in entry:
                  continue
              lines = entry.splitlines()
              print("\n".join(lines[:10]))
              main = next((i for i, line in enumerate(lines) if line.startswith('"main"')), None)
              print("\n".join(lines[main:main + 50]) if main is not None else "(kein Stack des Hauptthreads)")
          PY
            exit 1
          fi
          echo "Keine Abstürze und keine ANRs."

      - name: Logs hochladen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stresstest-android-${{ matrix.android }}
          path: |
            monkey.log
            crash.log
            logcat.log
            anr.log
          if-no-files-found: ignore

  release:
    name: Release veröffentlichen
    needs: [build, ui-test, stress-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Version bestimmen
        id: version
        env:
          INPUT_RELEASE: ${{ inputs.release }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HAS_KEY: ${{ secrets.FITPLAN_KEYSTORE_PASSWORD != '' }}
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_RELEASE" ]]; then
            tag="$INPUT_RELEASE"
          elif [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            tag="v$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
            if [[ "$tag" == v ]] || git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              tag=""
            fi
          fi
          if [[ -n "$tag" && "$HAS_KEY" != true ]]; then
            echo "::warning::Kein Release $tag: Das Secret FITPLAN_KEYSTORE_PASSWORD fehlt (Settings › Secrets and variables › Actions)."
            tag=""
          fi
          echo "Release: ${tag:-keins}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: APK holen
        if: steps.version.outputs.tag != ''
        uses: actions/download-artifact@v5
        with:
          name: FitPlan-apk
          path: dist

      # Veröffentlicht wird nur, was mit dem Release-Schlüssel signiert ist – nie ein Debug-Build.
      - name: Signatur prüfen
        if: steps.version.outputs.tag != ''
        env:
          RELEASE_CERT_SHA256: 3c32d935445b2cb616fc334c10bd809aed0b06f22038e332aed49bacc4ec37d1
        run: |
          set -o pipefail
          ls -la dist
          # Neueste Build-Tools-Version mit apksigner verwenden.
          apksigner=""
          for dir in $(ls -d "$ANDROID_HOME"/build-tools/* | sort -rV); do
            if [[ -x "$dir/apksigner" ]]; then
              apksigner="$dir/apksigner"
              break
            fi
          done
          echo "apksigner: ${apksigner:-nicht gefunden}"
          "$apksigner" verify --print-certs dist/FitPlan.apk 2>&1 | tee certs.txt
          actual=$(grep -oiE 'SHA-256 digest: [0-9a-f]{64}' certs.txt | head -n 1 | awk '{print tolower($3)}' || true)
          echo "Zertifikat der APK: ${actual:-keins}"
          if [[ "$actual" != "$RELEASE_CERT_SHA256" ]]; then
            echo "::error::Die APK ist nicht mit dem Release-Schlüssel signiert."
            exit 1
          fi

      - name: Release veröffentlichen
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Fehlt der Tag noch, legt die Action ihn auf dem gebauten Commit an.
          target_commitish: ${{ github.sha }}
          name: FitPlan ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes.md
          files: dist/FitPlan.apk
