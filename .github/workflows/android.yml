name: Android-Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testen & APK bauen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit-Tests, Lint und APK
        run: |
          set -o pipefail
          ./gradlew --continue testDebugUnitTest lintDebug assembleRelease 2>&1 | tee build.log

      - name: Fehlerübersicht
        if: failure()
        run: |
          grep -E "^e: |: Error: |FAILED|What went wrong|^> " build.log | head -150 || true

      - name: APK umbenennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/FitPlan.apk
          ls -la dist/

      - name: APK hochladen
        uses: actions/upload-artifact@v5
        with:
          name: FitPlan-apk
          path: dist/FitPlan.apk

      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: berichte
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FitPlan.apk
          generate_release_notes: true

  ui-test:
    name: UI-Test im Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test-APKs bauen
        timeout-minutes: 25
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest 2>&1 | tee ui-build.log

      - name: Fehlerübersicht Build
        if: failure()
        run: |
          grep -E "^e: |FAILED|What went wrong|^> " ui-build.log | head -100 || true

      - name: UI-Test ausführen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          cores: 4
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest || touch ui-test-failed
            mkdir -p device-screenshots
            adb shell ls -R /sdcard/Android/media/de.fitplan.app.debug /sdcard/Android/data/de.fitplan.app.debug/files || true
            adb pull /sdcard/Android/media/de.fitplan.app.debug device-screenshots/media || true
            adb pull /sdcard/Android/data/de.fitplan.app.debug/files/screenshots device-screenshots/files || true
            test ! -f ui-test-failed

      - name: Screenshots ins Log schreiben
        if: always()
        run: |
          # Verkleinerte Screenshots als Base64 ins Log, damit sie auch ohne Artefakt-Download prüfbar sind.
          find device-screenshots -name '*.jpg' 2>/dev/null | sort | while read -r f; do
            name=$(basename "$f" .jpg)
            echo "SHOT-BEGIN $name"
            base64 -w 4000 "$f" | sed 's/^/SHOT /'
            echo "SHOT-END $name"
          done

      - name: Screenshots und Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test
          path: |
            app/build/outputs/connected_android_test_additional_output/
            device-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
